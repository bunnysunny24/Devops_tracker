apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-app-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/sanju-devops/automated-cloud-native-deployment.git'
    targetRevision: HEAD
    path: helm/cloud-native-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cloud-native
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
