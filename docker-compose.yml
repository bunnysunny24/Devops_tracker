version: '3.8'

services:
  # 1. Cloud-Native Core Application
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cloud-native-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CloudNativePulse
      - APP_VERSION=v1.0.0
      - APP_ENV=production
    networks:
      - cloud-native-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 2. Prometheus Observability Engine
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: cloud-native-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - cloud-native-net
    depends_on:
      - app

  # 3. Grafana Analytics & Visual Dashboards
  grafana:
    image: grafana/grafana:10.3.3
    container_name: cloud-native-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    networks:
      - cloud-native-net
    depends_on:
      - prometheus

  # 4. Alertmanager Alert Dispatcher
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cloud-native-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - cloud-native-net

  # 5. Node Exporter Host Telemetry
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: cloud-native-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - cloud-native-net

networks:
  cloud-native-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
