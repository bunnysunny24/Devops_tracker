---
- name: Automate E-Commerce Cloud-Native Server Setup and Deployment
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt repository cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - git
          - python3-pip
        state: present

    - name: Add Docker official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Clone or pull application repository
      git:
        repo: "https://github.com/sanju-devops/automated-cloud-native-deployment.git"
        dest: /home/ubuntu/app
        version: main
        force: yes
      become: no

    - name: Deploy application using Docker Compose
      command: docker compose up -d --build
      args:
        chdir: /home/ubuntu/app

    - name: Verify application container status
      command: docker ps
      register: docker_status

    - name: Display running containers
      debug:
        var: docker_status.stdout_lines
