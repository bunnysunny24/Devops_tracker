name: Cloud-Native CD Pipeline (Continuous Deployment)

on:
  workflow_run:
    workflows: ["Cloud-Native CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Validate & Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests Syntax (Client Dry-Run)
        run: |
          echo "=========================================================="
          echo "Validating declarative Kubernetes manifests syntax..."
          echo "=========================================================="
          kubectl apply --dry-run=client -f k8s/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/01-configmap-secret.yaml
          kubectl apply --dry-run=client -f k8s/02-app-deployment.yaml
          kubectl apply --dry-run=client -f k8s/03-app-service.yaml
          kubectl apply --dry-run=client -f k8s/04-ingress.yaml
          kubectl apply --dry-run=client -f k8s/05-hpa.yaml
          kubectl apply --dry-run=client -f k8s/06-prometheus-k8s.yaml
          kubectl apply --dry-run=client -f k8s/07-grafana-k8s.yaml
          echo "All Kubernetes manifests successfully validated!"

      - name: Deploy to Remote Kubernetes Cluster
        if: "${{ secrets.KUBECONFIG_DATA != '' }}"
        run: |
          echo "Configuring remote kubeconfig credentials..."
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          echo "Applying manifests to production cluster..."
          kubectl apply -f k8s/

          echo "Verifying zero-downtime rolling update status..."
          kubectl rollout status deployment/cloud-native-app -n cloud-native --timeout=120s
          kubectl get pods -n cloud-native -o wide

      - name: CD Pipeline Completion Notice
        if: "${{ secrets.KUBECONFIG_DATA == '' }}"
        run: |
          echo "=========================================================="
          echo "All Kubernetes deployment manifests are verified & valid!"
          echo "Cluster target: Production AWS EKS ready."
          echo "Note: To trigger live remote deployment, add base64 kubeconfig"
          echo "to repo Settings -> Secrets and variables -> Actions as KUBECONFIG_DATA."
          echo "=========================================================="
