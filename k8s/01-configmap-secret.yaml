apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cloud-native
  labels:
    app: cloud-native-app
data:
  APP_NAME: "CloudNativePulse"
  APP_ENV: "production"
  APP_VERSION: "v1.0.0"
  PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cloud-native
  labels:
    app: cloud-native-app
type: Opaque
stringData:
  API_SECRET_KEY: "cloud-native-super-secret-key-prod"
  DATABASE_URL: "sqlite:///./app_prod.db"
