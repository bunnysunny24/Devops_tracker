apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-native-app.fullname" . }}-config
  labels:
    {{- include "cloud-native-app.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.env.appName | quote }}
  APP_ENV: {{ .Values.env.appEnv | quote }}
  APP_VERSION: {{ .Values.env.appVersion | quote }}
